# Every push and pull request. The module is built with warnings failing the build (NORM.md, N 6.1)
# and its tests run on Linux, Windows and macOS, the desktop systems a game ships for (N 6.2).
name: build

# Documents are left out, the README apart, whose commands a reader follows.
on:
  push:
    paths: ['**', '!.github/**.md', '!AGENTS.md', '!.github/assets/**']
  pull_request:
    paths: ['**', '!.github/**.md', '!AGENTS.md', '!.github/assets/**']

permissions:
  contents: read

# A newer push to a branch cancels the run of the one before it, whose result nobody reads.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS named rather than the latest labels, so a new release under a label
        # changes nothing with no commit to show for it.
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # The tests took 5.5 minutes on the macOS runner, 6.5 on the Windows runner and 22.3 on the
    # Linux runner in the run of 3c43c5e (gh run view 45775092884 --json jobs), the Linux runner
    # several times slower than the others at the tests' CPU kernels, so 60 minutes is reached only
    # where a restore, the download of slangc or a test hangs (N 6.8).
    timeout-minutes: 60
    steps:
      # The tests take the checks every module keeps from the Tools submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The compiler the tests compile the library's Slang with, kept between runs under the
      # script's hash, and downloaded by the script where none is kept.
      - uses: actions/cache@v6
        with:
          path: build/tools/slang
          key: slang-${{ runner.os }}-${{ hashFiles('build/fetch-slang.sh') }}

      # In bash on every system, the Windows runner's coming with Git for Windows.
      - run: build/fetch-slang.sh
        shell: bash

      - run: dotnet build RadianceCascades.slnx -warnaserror

      - run: dotnet test RadianceCascades.Tests --no-build --logger trx --results-directory RadianceCascades.Tests/TestResults

      - uses: actions/upload-artifact@v7
        # Kept for a job canceled as well as one that failed, since a cut-short run is the one to
        # read.
        if: failure() || cancelled()
        with:
          name: test-results-${{ matrix.os }}
          path: RadianceCascades.Tests/TestResults/
          if-no-files-found: ignore
